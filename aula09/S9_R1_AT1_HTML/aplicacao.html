<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição em Evento</title>
</head>
<body>

    <h1>Inscrição em Evento</h1>
    <p>Todos os campos são obrigatórios, exceto Observações.</p>
    <form>
        <p>
            <label for="ev-nome">Nome Completo:</label>
            <input type="text" id="ev-nome" name="nome" placeholder="Digite seu nome completo" required>
        </p>

        <p>
            <label for="ev-email">E-mail:</label>
            <input type="email" id="ev-email" name="email" placeholder="seu.email@exemplo.com" required>
        </p>

        <p>
            <label for="ev-tel">Telefone:</label>
            <input type="tel" pattern="[0-9]{10,11}" title="Digite o DDD e o telefone, somente números" id="ev-tel" name="telefone" placeholder="19999999999" aria-describedby="ev-tel-ajuda" required>
            <small id="ev-tel-ajuda">Informe o DDD e o telefone: 10 ou 11 dígitos, somente números.</small>
        </p>

        <p>
            <label for="ev-data">Data do Evento:</label>
            <input type="date" id="ev-data" name="data_evento" required>
        </p>

        <p>
            <label for="ev-qtd">Quantidade de Participantes:</label>
            <input type="number" id="ev-qtd" name="quantidade" min="1" placeholder="Ex: 2" required>
        </p>

        <p>
            <label for="ev-obs">Observações (opcional):</label>
            <textarea id="ev-obs" name="observacoes" placeholder="Alguma necessidade especial?"></textarea>
        </p>

        <button type="submit">Enviar Inscrição</button>
    </form>

</body>
</html>
