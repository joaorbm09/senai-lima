<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidatos</title>
</head>
<body>

    <h1>Cadastro de Candidatos</h1>
    <p>Todos os campos são obrigatórios.</p>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="cand-nome">Nome Completo:</label>
                <input type="text" id="cand-nome" name="nome" placeholder="Digite seu nome completo" required>
            </p>

            <p>
                <label for="cand-email">E-mail:</label>
                <input type="email" id="cand-email" name="email" placeholder="candidato@email.com" required>
            </p>

            <p>
                <label for="cand-tel">Telefone:</label>
                <input type="tel" pattern="[0-9]{10,11}" title="Digite o DDD e o telefone, somente números" id="cand-tel" name="telefone" placeholder="19988888888" aria-describedby="cand-tel-ajuda" required>
                <small id="cand-tel-ajuda">Informe o DDD e o telefone: 10 ou 11 dígitos, somente números.</small>
            </p>

            <p>
                <label for="cand-nasc">Data de Nascimento:</label>
                <input type="date" id="cand-nasc" name="nascimento" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Dados Profissionais</legend>
            <p>
                <label for="cand-area">Área de Atuação:</label>
                <select id="cand-area" name="area" required>
                    <option value="">Selecione uma área</option>
                    <option value="desenvolvimento">Desenvolvimento</option>
                    <option value="design">Design / UX</option>
                    <option value="dados">Ciência de Dados</option>
                </select>
            </p>

            <p>
                <label for="cand-salario">Pretensão Salarial (R$):</label>
                <input type="number" id="cand-salario" name="salario" min="0" step="0.01" placeholder="Ex: 4500.00" required>
            </p>

            <p>
                <label for="cand-portfolio">Portfólio (URL):</label>
                <input type="url" id="cand-portfolio" name="portfolio" placeholder="https://meuportfolio.com" required>
            </p>
        </fieldset>

        <button type="submit">Cadastrar Candidato</button>
    </form>

</body>
</html>
