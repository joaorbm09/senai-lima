<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura de Chamado Técnico</title>
</head>
<body>

    <h1>Abertura de Chamado Técnico</h1>
    <p>Todos os campos são obrigatórios.</p>
    <form>
        <p>
            <label for="eq-num">Número do Equipamento:</label>
            <input type="text" id="eq-num" name="equipamento" placeholder="Ex: EQ-1042" aria-describedby="eq-num-ajuda" required minlength="4" maxlength="10">
            <small id="eq-num-ajuda">Informe o código do equipamento com 4 a 10 caracteres.</small>
        </p>

        <p>
            <label for="ch-data">Data:</label>
            <input type="date" id="ch-data" name="data_chamado" required>
        </p>

        <p>
            <label for="ch-prio">Prioridade:</label>
            <select id="ch-prio" name="prioridade" required>
                <option value="">Selecione a prioridade</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
        </p>

        <p>
            <label for="ch-desc">Descrição do Problema:</label>
            <textarea id="ch-desc" name="descricao" placeholder="Descreva o problema com detalhes..." aria-describedby="ch-desc-ajuda" rows="5" required minlength="10" maxlength="300"></textarea>
            <small id="ch-desc-ajuda">Descreva o problema usando de 10 a 300 caracteres.</small>
        </p>

        <p>
            <label for="ch-email">E-mail do Solicitante:</label>
            <input type="email" id="ch-email" name="email_solicitante" placeholder="solicitante@empresa.com" required>
        </p>

        <button type="submit">Abrir Chamado</button>
    </form>

</body>
</html>
